# ============================================================================
# Application Identity
# ============================================================================
spring.application.name=tcg.decklists.api
# ============================================================================
# Database Configuration
# ============================================================================
# PostgreSQL connection settings with environment variable overrides
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tcg_decklists}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:testing1234}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP Connection Pool Configuration
# Tuned for optimal performance and resource management
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# ============================================================================
# Liquibase Configuration
# ============================================================================
# Enable Liquibase for database migrations
spring.liquibase.enabled=true
# Explicitly specify the changelog path for clarity
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# ============================================================================
# JPA/Hibernate Configuration
# ============================================================================
# Specify PostgreSQL dialect for optimal query generation
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# CRITICAL: Disable Open Session In View pattern
# This prevents lazy loading exceptions and N+1 query problems by ensuring
# all database operations happen within explicit @Transactional boundaries
spring.jpa.open-in-view=false
# SQL logging is controlled via logging configuration below
spring.jpa.show-sql=false
# ============================================================================
# Error Handling Configuration
# ============================================================================
# Enable RFC 7807 Problem Details for standardized error responses
spring.mvc.problemdetails.enabled=true
# Include error details in responses (useful for development)
server.error.include-message=always
server.error.include-binding-errors=always
# Security: Never expose exception details or stack traces
server.error.include-exception=false
server.error.include-stacktrace=never
# ============================================================================
# Actuator & Monitoring Configuration
# ============================================================================
# Expose health, info, metrics, and Prometheus endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
# Health endpoint configuration
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
# Enable specific health indicators
management.health.defaults.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
# Info endpoint configuration
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
# ============================================================================
# Application Metadata
# ============================================================================
info.app.name=TCG Decklists API
info.app.description=Pokemon TCG deck builder and viewer API
info.app.version=1.0.0
info.app.encoding=${file.encoding}
info.app.java.version=${java.version}
# ============================================================================
# Logging Configuration
# ============================================================================
# Development-friendly logging configuration for easier debugging
# Enable ANSI color output in console logs
spring.output.ansi.enabled=always
# Root logging level
logging.level.root=INFO
# Application package logging
logging.level.dev.lukeholland.tcg.decklists=INFO
# Spring framework logging
logging.level.org.springframework.web=INFO
# Hibernate SQL logging (useful for debugging queries and performance)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
